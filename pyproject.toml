[project]
name = "customer-intelligence-agent-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  # Cap below 0.137: FastAPI 0.137 made include_router insert lazy _IncludedRouter
  # mounts into app.routes, which prometheus-fastapi-instrumentator 7.1.0 cannot
  # read (route.path -> AttributeError, crashing every request). Re-raise the cap
  # once the instrumentator supports the lazy-include change.
  "fastapi>=0.115.6,<0.137",
  "uvicorn[standard]>=0.30.6",
  "python-dotenv>=1.0.1",
  "pandas>=2.2.2",
  "tabulate>=0.9.0",
  "openpyxl>=3.1.5",
  "sqlalchemy>=2.0.32",
  "asyncpg>=0.29.0",
  "psycopg[binary]>=3.2.3",
  "psycopg-pool>=3.2.4",
  "alembic>=1.13.2",
  "langgraph>=1.1.10",
  "langgraph-checkpoint-postgres>=3.0.2",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.14.0",
  "orjson>=3.10.18",
  "sqlalchemy[asyncio]>=2.0.49",
  # LLM providers
  "google-genai>=1.17.0",
  "openai>=1.0.0",
  "python-multipart>=0.0.20",
  "prometheus-fastapi-instrumentator>=7.1.0",
  "mlflow>=3.14.0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "sqlglot>=30.14.0",
]

# tests/ existed with no way to run it -- pytest was never declared. Dev-only, so
# it stays out of the runtime image.
[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Drift tests need a live database and skip without one, so a bare `pytest` run on
# a machine with no Postgres still passes rather than erroring.
addopts = "-q"
